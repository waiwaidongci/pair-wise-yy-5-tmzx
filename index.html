<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦上机配伍台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 18px; margin: 14px 0 8px; }
    h3 { font-size: 14px; margin: 12px 0 6px; color: #5d5145; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; padding: 0; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .blocks button.active { outline: 3px solid #1f1b16; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .banner { display: none; margin: 0 0 10px; padding: 10px 12px; border-radius: 8px; font-weight: 700; }
    .banner.info { display: block; background: #fdf3dc; border: 1px solid #e4cf9e; color: #8a5a12; }
    .banner.warn { display: block; background: #f8e3de; border: 1px solid #e0a89e; color: #a03a2e; }
    .compat { padding: 0 16px 18px; }
    .compat-title { margin: 4px 0 12px; }
    .compat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .badge.pending { background: #f4e3c2; color: #8a5a12; }
    .badge.passed { background: #dcebd4; color: #2f6b2f; }
    .badge.returned { background: #f2d2cc; color: #a03a2e; }
    .badge.invalid { background: #e3ddd4; color: #6b6258; }
    .badge.handed { background: #d3e2ee; color: #1f5f78; }
    .badge.drying { background: #f4e3c2; color: #8a5a12; }
    .badge.busy { background: #d3e2ee; color: #1f5f78; }
    .badge.idle { background: #dcebd4; color: #2f6b2f; }
    table.items { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    table.items th, table.items td { border-bottom: 1px solid #e1d5c5; padding: 6px 4px; text-align: left; vertical-align: middle; }
    table.items select { padding: 5px; font-size: 12px; }
    .sw { display: inline-block; width: 13px; height: 13px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); vertical-align: -2px; margin: 0 2px; }
    .reasons { margin: 6px 0; padding-left: 18px; color: #a03a2e; font-weight: 700; }
    .ok { color: #2f6b2f; font-weight: 700; }
    .bad { color: #a03a2e; font-weight: 700; }
    .warn-t { color: #8a5a12; font-weight: 700; }
    .muted { color: #8a7d6e; font-size: 12px; }
    .rowline { border-bottom: 1px solid #e1d5c5; padding: 7px 0; font-size: 13px; }
    .mini-btn { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
    .btnrow { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .btnrow select { flex: 1; }
    .sheet-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    #toast { position: fixed; right: 18px; bottom: 18px; background: #282018; color: #fffaf2; padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .25s; pointer-events: none; font-weight: 700; z-index: 9; }
    #toast.show { opacity: 1; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦上机配伍台</h1><div>排版、配伍、交接分段承载：纹样保存生成待复核用色清单，染缸批次与机台占用一目了然。</div></div>
    <div class="toolbar"><button id="saveBtn">保存纹样·生成复核单</button><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>
      <h2>色线库（色位）</h2>
      <div class="palette" id="palette"></div>
      <label>当前色位颜色 <span id="activeColorLabel" class="muted"></span></label>
      <input id="colorEdit" type="color">
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel">
      <div id="banner" class="banner"></div>
      <div class="grid" id="grid"></div>
    </section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p>点击填色，按住拖动可连续填色。纹样、色位或基础块一变，复核单即失效需重排。</p>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>
  <section class="compat">
    <h2 class="compat-title">上机配伍台</h2>
    <div class="compat-grid">
      <div class="panel">
        <h2>复核单 · 配伍判定</h2>
        <div id="sheetBody"></div>
      </div>
      <div class="panel">
        <h2>染缸与批次</h2>
        <div id="vatList"></div>
        <p class="muted">染缸交接上机后需晾干约 10 分钟，未晾干不能接下一份；批次色距容差 ΔE ≤ 10。</p>
        <h3>开新批次</h3>
        <div class="btnrow"><select id="nbVat"></select><select id="nbColor"></select><button id="nbBtn" class="secondary">开批次</button></div>
        <h3>批次复测</h3>
        <div id="batchList"></div>
      </div>
      <div class="panel">
        <h2>机台占用</h2>
        <div id="machineList"></div>
        <h3>交接记录</h3>
        <div id="recordList"></div>
      </div>
      <div class="panel">
        <h2>历史版本</h2>
        <div id="versionList"></div>
      </div>
    </div>
  </section>
  <div id="toast"></div>
  <script src="js/stores.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
